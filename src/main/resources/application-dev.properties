# 개발 환경 설정
# 환경변수 또는 외부 설정 파일로 오버라이드 가능

# Database (환경변수 또는 외부 설정에서 주입)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# FastAPI 서버 설정
ai.fastapi.url=${FASTAPI_URL:http://localhost:8000}

# CORS 설정
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# CSV Import (개발 환경에서만 자동 로딩)
app.import.on-start=true

# JPA 설정 (개발 환경)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

