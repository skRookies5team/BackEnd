# Database 설정은 환경별 프로파일에서 관리
# 기본값: 실제 DB 서버 (로컬 개발 시 --spring.profiles.active=local 사용 권장)
# 로컬 개발 시: IntelliJ 실행 설정에서 VM options에 -Dspring.profiles.active=local 추가
# 또는 application-local.properties 파일 생성 (Git에 커밋하지 않음)
spring.datasource.url=${DB_URL:jdbc:mariadb://175.114.229.152:3306/ai_agent?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:5whakfldkelql}

# CSV Import 설정
app.csv.base-dir=./data
app.csv.encoding=UTF-8
app.loader.create-id=true
app.loader.truncate=false
# app.import.on-start는 환경별 프로파일에서 설정

# JPA 설정
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect
# show-sql, format_sql은 환경별 프로파일에서 설정

# Logging (기본값, 환경별 프로파일에서 오버라이드 가능)
logging.level.root=INFO
logging.level.com.AIagnet.agent=INFO

# Jackson (추가)
spring.jackson.time-zone=Asia/Seoul
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.fail-on-empty-beans=false
spring.jackson.default-property-inclusion=non_null

# Swagger UI 설정
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.display-request-duration=true
springdoc.swagger-ui.doc-expansion=none
springdoc.swagger-ui.default-models-expand-depth=1
springdoc.swagger-ui.default-model-expand-depth=1
springdoc.packages-to-scan=com.AIagnet.agent
springdoc.paths-to-match=/api/**

# FastAPI 서버 설정 (기본값, 환경별 프로파일에서 오버라이드 가능)
ai.fastapi.url=${FASTAPI_URL:http://localhost:8000}
ai.fastapi.timeout.connect=5000
ai.fastapi.timeout.read=30000

# CORS 설정 (기본값, 환경별 프로파일에서 오버라이드 가능)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Actuator 설정
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.health.fastapi.enabled=true